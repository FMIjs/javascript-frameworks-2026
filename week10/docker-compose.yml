services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - "27018:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  server:
    build:
      context: ./server
    image: week10-server
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: "4000"
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB: todos
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  client:
    build:
      context: ./client
    image: week10-client
    ports:
      - "8080:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  mongo_data:
